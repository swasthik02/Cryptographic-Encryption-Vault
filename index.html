<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptographic Encryption Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cryptographic Encryption Vault</h1>
        <p>Secure your private notes with encryption.</p>
        <h2>Enter Password</h2>
        <input type="password" id="password"
               placeholder="Enter master password">
        <button onclick="createVault()">Create Vault</button>
        <div id="vault" style="display:none;">
            <h2>Add Private Note</h2>
            <input type="text" id="title"
                   placeholder="Enter note title">
            <textarea id="message"
                      placeholder="Enter your private message"></textarea>
            <button onclick="addNote()">Add Note</button>
            <h2>Your Notes</h2>
            <div id="notes"></div>
            <button onclick="saveVault()">Encrypt and Download</button>
        </div>
        <p id="status"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
